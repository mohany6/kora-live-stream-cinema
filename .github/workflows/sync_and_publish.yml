name: Sync Matches, Publish to Blogger & Deploy Stream Cinema

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: sync-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-publish:
    name: Sync Matches, Publish & Deploy
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_PAGES: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export static streams JSON
        env:
          LIVE_SCORE_API_URL: ${{ secrets.LIVE_SCORE_API_URL }}
          LIVE_SCORE_SCRAPER_URL: ${{ secrets.LIVE_SCORE_SCRAPER_URL }}
          LIVE_SCORE_LEAGUES: ${{ secrets.LIVE_SCORE_LEAGUES }}
        run: python scripts/export_static_streams.py

      - name: Publish trending match articles to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRETS: ${{ secrets.BLOGGER_CLIENT_SECRETS }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ACCESS_TOKEN: ${{ secrets.BLOGGER_ACCESS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BLOGGER_PUBLISH_EMAIL: ${{ secrets.BLOGGER_PUBLISH_EMAIL }}
          STREAM_PLATFORM_URL: ${{ secrets.STREAM_PLATFORM_URL }}
          LIVE_SCORE_API_URL: ${{ secrets.LIVE_SCORE_API_URL }}
          LIVE_SCORE_SCRAPER_URL: ${{ secrets.LIVE_SCORE_SCRAPER_URL }}
          LIVE_SCORE_LEAGUES: ${{ secrets.LIVE_SCORE_LEAGUES }}
        run: python scripts/auto_blogger_publisher.py

      - name: Publish daily match & results posters to Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          LIVE_SCORE_API_URL: ${{ secrets.LIVE_SCORE_API_URL }}
          LIVE_SCORE_SCRAPER_URL: ${{ secrets.LIVE_SCORE_SCRAPER_URL }}
          LIVE_SCORE_LEAGUES: ${{ secrets.LIVE_SCORE_LEAGUES }}
        run: python scripts/auto_facebook_publisher.py --mode auto

      - name: Set up Node.js 22 for Remotion Reels
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Remotion Reels dependencies
        run: cd video_reels && npm install --no-audit --no-fund

      - name: Publish automated Facebook Reels
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          LIVE_SCORE_API_URL: ${{ secrets.LIVE_SCORE_API_URL }}
          LIVE_SCORE_SCRAPER_URL: ${{ secrets.LIVE_SCORE_SCRAPER_URL }}
          LIVE_SCORE_LEAGUES: ${{ secrets.LIVE_SCORE_LEAGUES }}
        run: python scripts/auto_facebook_reels_publisher.py --mode auto

      - name: Commit and push updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in frontend/public/data/matches.json data/matches.json data/published_articles.json data/published_facebook.json data/published_facebook_reels.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): update matches and published articles [skip ci]"
            git push || (git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push)
          else
            echo "No data changes to commit."
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and build
        run: cd frontend && npm ci && npm run build

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_PAGES == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'kora-stream-cinema' }}

      - name: Upload frontend deployment artifact
        if: env.HAS_CLOUDFLARE_PAGES != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
